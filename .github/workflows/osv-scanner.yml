name: OSV Scanner
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install and run osv-scanner
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          echo "osv-scanner version:"
          osv-scanner --version
          echo "Running scan..."
          osv-scanner --config ./osv-scanner.toml -r ./
          echo "Scan completed successfully"
