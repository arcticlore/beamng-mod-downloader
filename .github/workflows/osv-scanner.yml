name: OSV Scanner
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Install and run osv-scanner
        run: |
          set -euo pipefail
          curl -sSfL https://osv.dev/install.sh | sh -s -- -b /usr/local/bin
          echo "osv-scanner version:"
          osv-scanner --version
          echo "Running scan..."
          osv-scanner --config ./osv-scanner.toml -r ./
          echo "Scan completed successfully"
