name: OSV Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af67726
      - name: Install and run osv-scanner
        run: |
          set -e
          curl -sSfL https://osv.dev/install.sh | sh -s -- -b /usr/local/bin
          osv-scanner --config osv-scanner.toml \
            src-tauri/Cargo.lock frontend/package-lock.json
