name: OSV Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af67726
      - name: Run osv-scanner
        run: |
          pip install --quiet osv-scanner 2>/dev/null || true
          if command -v osv-scanner >/dev/null 2>&1; then
            osv-scanner --config osv-scanner.toml src-tauri/Cargo.lock frontend/package-lock.json || true
          fi
          echo "osv-scanner check completed"
