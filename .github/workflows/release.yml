name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release gate: теги создаются только после полного зелёного build workflow
  # на этом же commit. Ожидаем check-runs 'build' по SHA тега.
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Wait for required build check-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/wait-for-checks.sh "${GITHUB_SHA}"

  publish:
    needs: gate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            name: bundles-linux
          - platform: windows-latest
            args: --bundles nsis,msi
            name: bundles-windows
          - platform: macos-latest
            args: ""
            name: bundles-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.1
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-19
        with:
          toolchain: 1.88.0

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: npm ci
        run: npm ci

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "1"
        with:
          tagName: v__VERSION__
          releaseName: BeamNG Mod Downloader v__VERSION__
          releaseDraft: true
          releaseBody: |
            Автоматическая сборка из тега v__VERSION__.

            - Linux: AppImage, deb, rpm
            - Windows: NSIS (.exe), MSI
            - macOS: DMG

            Пакеты дистрибутивов (Ubuntu/Debian/Fedora/openSUSE) — репозиторий
            OBS `home:arcticlore:apps`, см. packaging/README.md.

            Сборка прошла release gate: все обязательные check-runs build-джобы
            на этом commit — успешны.
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14