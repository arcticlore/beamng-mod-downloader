[package]
name = "beamng-mod-downloader"
version = "0.1.1"
description = "Кроссплатформенный установщик модов для BeamNG.drive"
edition = "2021"

[lib]
name = "beamng_mod_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "rt-multi-thread"] }
scraper = "0.22"
futures-util = "0.3"
dirs = "6"
glob = "0.3"
anyhow = "1"
thiserror = "2"
percent-encoding = "2"
base64 = "0.22"
