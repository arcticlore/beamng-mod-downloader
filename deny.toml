# cargo-deny configuration (исполняется удалённо в CI, job cargo-deny).
# Политика: никаких unknown/unlicensed, стандартные opensource-лицензии;
# advisories из RustSec Advisory Database (github.com/rustsec/advisory-db).
version = 2

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

# Исключения добавляются ТОЛЬКО с owner, причиной и сроком expiry (см. §11 промта).
# [[advisories.ignore]]
# id = "RUSTSEC-0000-0000"

[licenses]
unlicensed = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "MIT OR Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "WTFPL",
  "OFL-1.1",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"